# Build & run config untuk Railway (Nixpacks) — juga cocok untuk Render via dashboard.
[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_20"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm ci --ignore-scripts"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "php artisan migrate --force && (php artisan storage:link || true) && php artisan serve --host=0.0.0.0 --port=$PORT"
