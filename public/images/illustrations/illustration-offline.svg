<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <!-- Background Canvas -->
  <circle cx="200" cy="150" r="120" fill="#F3F6F8" />
  
  <!-- Ocean Waves -->
  <path d="M60 215 Q100 200 140 215 T220 215 T300 215 T360 215 L360 250 L60 250 Z" fill="#0E9AA7" />
  <path d="M50 230 Q90 220 130 230 T210 230 T290 230 T370 230 L370 255 L50 255 Z" fill="#0B7A85" />

  <!-- Island Rock with Lighthouse -->
  <ellipse cx="200" cy="210" rx="60" ry="16" fill="#1F2937" />
  
  <!-- Lighthouse Tower (Archipelago Coastal Tower) -->
  <polygon points="185,210 190,140 210,140 215,210" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" />
  <!-- Red/Orange Stripes on Lighthouse -->
  <polygon points="187,190 188,175 212,175 213,190" fill="#F4743B" />
  <polygon points="189,160 190,148 210,148 211,160" fill="#F4743B" />
  <!-- Lantern Room -->
  <rect x="188" y="128" width="24" height="12" fill="#F6C945" stroke="#1F2937" stroke-width="2" />
  <!-- Dome Roof -->
  <path d="M186 128 Q200 115 214 128 Z" fill="#1F2937" />

  <!-- Radiating Disconnected WiFi Waves -->
  <g transform="translate(200, 80)">
    <!-- Arc 3 (Outer - broken) -->
    <path d="M-40 0 A45 45 0 0 1 40 0" stroke="#E5484D" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8" fill="none" />
    <!-- Arc 2 (Middle) -->
    <path d="M-25 15 A30 30 0 0 1 25 15" stroke="#E5484D" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Arc 1 (Inner) -->
    <path d="M-12 28 A15 15 0 0 1 12 28" stroke="#E5484D" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Diagonal Slash Line through WiFi -->
    <line x1="-30" y1="38" x2="30" y2="-10" stroke="#E5484D" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Offline Status Badge -->
  <g transform="translate(270, 60)">
    <rect width="85" height="28" rx="14" fill="#FEECEE" stroke="#E5484D" stroke-width="1.5" />
    <text x="42.5" y="19" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#E5484D" text-anchor="middle">OFFLINE</text>
  </g>
</svg>
