<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <!-- Background Circle Canvas -->
  <circle cx="200" cy="150" r="120" fill="#F3F6F8" />
  
  <!-- Ocean Waves (Flat Solid) -->
  <path d="M70 210 Q110 195 150 210 T230 210 T310 210 T350 210 L350 240 L70 240 Z" fill="#E6F6F7" />
  <path d="M60 220 Q100 208 140 220 T220 220 T300 220 T360 220 L360 245 L60 245 Z" fill="#0E9AA7" />
  <path d="M50 232 Q90 222 130 232 T210 232 T290 232 T370 232 L370 250 L50 250 Z" fill="#0B7A85" />

  <!-- Distant Island Silhouette -->
  <ellipse cx="295" cy="205" rx="35" ry="12" fill="#E5E9ED" />
  <path d="M295 195 L292 185 L295 180 L298 185 Z" fill="#6B7280" />
  <circle cx="295" cy="180" r="6" fill="#F6C945" />

  <!-- Dotted Lost Route Path -->
  <path d="M110 120 Q150 90 190 125 T240 140" stroke="#F4743B" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round" />
  <circle cx="110" cy="120" r="5" fill="#F4743B" />

  <!-- Traditional Pinisi Boat -->
  <!-- Hull -->
  <path d="M140 195 L160 222 Q200 225 240 222 L260 195 Z" fill="#1F2937" />
  <path d="M146 195 L162 216 Q200 218 238 216 L254 195 Z" fill="#374151" />
  <rect x="195" y="188" width="12" height="7" fill="#F6C945" />

  <!-- Masts -->
  <rect x="180" y="125" width="4" height="70" fill="#1F2937" />
  <rect x="215" y="115" width="4" height="80" fill="#1F2937" />

  <!-- Pinisi Sails (Teal & Orange Brand Palette) -->
  <path d="M184 130 L212 165 L184 170 Z" fill="#0E9AA7" />
  <path d="M180 135 L155 170 L180 172 Z" fill="#F3F6F8" stroke="#E5E9ED" stroke-width="2" />
  <path d="M219 120 L250 160 L219 165 Z" fill="#F4743B" />
  <path d="M215 125 L190 162 L215 165 Z" fill="#0E9AA7" />

  <!-- Floating Compass / Astrolabe Accent -->
  <g transform="translate(100, 80)">
    <circle cx="24" cy="24" r="24" fill="#FFFFFF" stroke="#E5E9ED" stroke-width="2" />
    <circle cx="24" cy="24" r="20" fill="#F3F6F8" />
    <!-- Needle -->
    <polygon points="24,8 28,24 24,22" fill="#F4743B" />
    <polygon points="24,40 28,24 24,22" fill="#6B7280" />
    <polygon points="24,8 20,24 24,22" fill="#E05E24" />
    <polygon points="24,40 20,24 24,22" fill="#4B5563" />
    <circle cx="24" cy="24" r="3" fill="#1F2937" />
    <!-- Compass markings -->
    <rect x="23" y="5" width="2" height="3" fill="#1F2937" />
    <rect x="23" y="40" width="2" height="3" fill="#1F2937" />
    <rect x="5" y="23" width="3" height="2" fill="#1F2937" />
    <rect x="40" y="23" width="3" height="2" fill="#1F2937" />
  </g>

  <!-- Big 404 Watermark Badge (Pure Flat) -->
  <g transform="translate(260, 60)">
    <rect width="80" height="36" rx="8" fill="#FFFFFF" stroke="#E5E9ED" stroke-width="2" />
    <text x="40" y="24" font-family="'Epilogue', 'Outfit', sans-serif" font-weight="700" font-size="20" fill="#0E9AA7" text-anchor="middle">404</text>
  </g>
</svg>
