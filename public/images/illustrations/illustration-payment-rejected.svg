<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <!-- Background Canvas -->
  <circle cx="200" cy="150" r="120" fill="#F3F6F8" />
  
  <!-- Base Shadow -->
  <ellipse cx="200" cy="235" rx="85" ry="12" fill="#E5E9ED" />

  <!-- Bank Receipt / Transfer Slip Document -->
  <rect x="140" y="80" width="120" height="150" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="2" />
  
  <!-- Receipt Header -->
  <rect x="160" y="95" width="80" height="10" rx="2" fill="#0E9AA7" />
  <circle cx="150" cy="100" r="4" fill="#F6C945" />

  <!-- Text Lines on Receipt -->
  <rect x="155" y="115" width="90" height="5" rx="2" fill="#E5E9ED" />
  <rect x="155" y="126" width="70" height="5" rx="2" fill="#E5E9ED" />
  <rect x="155" y="137" width="85" height="5" rx="2" fill="#E5E9ED" />
  <rect x="155" y="148" width="60" height="5" rx="2" fill="#E5E9ED" />

  <!-- Total Amount Row -->
  <line x1="150" y1="165" x2="250" y2="165" stroke="#E5E9ED" stroke-width="2" stroke-dasharray="4 3" />
  <rect x="155" y="175" width="50" height="8" rx="2" fill="#1F2937" />
  <rect x="215" y="175" width="30" height="8" rx="2" fill="#0E9AA7" />

  <!-- Prominent RED REJECTED STAMP (Flat 2.0 Angle) -->
  <g transform="translate(145, 145) rotate(-14)">
    <rect width="115" height="38" rx="6" fill="#FEECEE" stroke="#E5484D" stroke-width="3" />
    <text x="57.5" y="25" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#E5484D" text-anchor="middle" letter-spacing="1">DITOLAK</text>
  </g>

  <!-- Big Red Cross Indicator Circle on Side -->
  <g transform="translate(255, 65)">
    <circle cx="24" cy="24" r="22" fill="#E5484D" />
    <path d="M16 16 L32 32 M32 16 L16 32" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Refresh / Upload Again Prompt on Left -->
  <g transform="translate(90, 100)">
    <circle cx="22" cy="22" r="20" fill="#FFFFFF" stroke="#0E9AA7" stroke-width="2" />
    <path d="M14 22 A8 8 0 1 1 22 30" stroke="#0E9AA7" stroke-width="3" stroke-linecap="round" fill="none" />
    <polyline points="22,33 22,27 28,27" fill="none" stroke="#0E9AA7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
