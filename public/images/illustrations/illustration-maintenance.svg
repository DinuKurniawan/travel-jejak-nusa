<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <!-- Background Canvas -->
  <circle cx="200" cy="150" r="120" fill="#F3F6F8" />
  
  <!-- Wooden Dock / Pier Structure -->
  <rect x="70" y="210" width="260" height="15" rx="3" fill="#6B7280" />
  <rect x="90" y="225" width="12" height="35" fill="#4B5563" />
  <rect x="150" y="225" width="12" height="35" fill="#4B5563" />
  <rect x="210" y="225" width="12" height="35" fill="#4B5563" />
  <rect x="270" y="225" width="12" height="35" fill="#4B5563" />
  <path d="M50 240 Q100 230 150 240 T250 240 T350 240 L350 260 L50 260 Z" fill="#0E9AA7" fill-opacity="0.3" />

  <!-- Ship in Drydock (Supported by wooden beams) -->
  <polygon points="120,210 130,175 140,210" fill="#F4743B" />
  <polygon points="260,210 250,175 240,210" fill="#F4743B" />

  <!-- Ship Hull on Dock -->
  <path d="M130 155 L145 190 Q190 195 235 190 L250 155 Z" fill="#1F2937" />
  <path d="M136 155 L148 184 Q190 188 232 184 L244 155 Z" fill="#374151" />
  
  <!-- Mast & Scaffolding -->
  <rect x="188" y="100" width="4" height="60" fill="#1F2937" />
  <line x1="170" y1="115" x2="210" y2="115" stroke="#F6C945" stroke-width="3" stroke-linecap="round" />
  <line x1="165" y1="135" x2="215" y2="135" stroke="#F6C945" stroke-width="3" stroke-linecap="round" />

  <!-- Heavy Pier Bollard with Mooring Rope -->
  <rect x="80" y="195" width="14" height="15" rx="3" fill="#1F2937" />
  <circle cx="87" cy="195" r="9" fill="#1F2937" />
  <!-- Iron Anchor Resting on Dock -->
  <g transform="translate(265, 175) scale(0.8)">
    <circle cx="20" cy="12" r="6" stroke="#1F2937" stroke-width="3" fill="none" />
    <line x1="20" y1="18" x2="20" y2="55" stroke="#1F2937" stroke-width="4" />
    <line x1="8" y1="28" x2="32" y2="28" stroke="#1F2937" stroke-width="4" stroke-linecap="round" />
    <path d="M5 45 C5 60 35 60 35 45" stroke="#1F2937" stroke-width="4" fill="none" stroke-linecap="round" />
  </g>

  <!-- Wrench & Screwdriver Tool Badge -->
  <g transform="translate(160, 50)">
    <circle cx="40" cy="30" r="28" fill="#FFFFFF" stroke="#0E9AA7" stroke-width="2" />
    <!-- Crossed Wrench / Tool -->
    <path d="M30 38 L48 20" stroke="#0E9AA7" stroke-width="3.5" stroke-linecap="round" />
    <path d="M32 20 L48 36" stroke="#F4743B" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Maintenance Status Pill -->
  <g transform="translate(245, 65)">
    <rect width="110" height="28" rx="14" fill="#FEF9E7" stroke="#F6C945" stroke-width="1.5" />
    <text x="55" y="19" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#755B00" text-anchor="middle">DOK PERAWATAN</text>
  </g>
</svg>
