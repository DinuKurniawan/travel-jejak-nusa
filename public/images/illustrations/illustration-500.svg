<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <!-- Background Canvas -->
  <circle cx="200" cy="150" r="120" fill="#F3F6F8" />
  
  <!-- Storm Waves (Dynamic Flat Shapes) -->
  <path d="M50 200 Q90 170 130 205 T210 205 T290 190 T360 215 L360 250 L50 250 Z" fill="#E5484D" fill-opacity="0.1" />
  <path d="M50 215 Q100 185 150 215 T250 210 T350 210 L350 250 L50 250 Z" fill="#0E9AA7" />
  <path d="M40 228 Q90 205 140 228 T240 225 T360 225 L360 255 L40 255 Z" fill="#0B7A85" />

  <!-- Steam / Cloud from Ship Engine -->
  <circle cx="160" cy="115" r="14" fill="#FFFFFF" stroke="#E5E9ED" stroke-width="2" />
  <circle cx="180" cy="105" r="18" fill="#FFFFFF" stroke="#E5E9ED" stroke-width="2" />
  <circle cx="205" cy="112" r="15" fill="#FFFFFF" stroke="#E5E9ED" stroke-width="2" />

  <!-- Tilting Pinisi Boat in Waves -->
  <g transform="rotate(8 200 180)">
    <!-- Hull -->
    <path d="M135 180 L155 208 Q195 212 235 208 L255 180 Z" fill="#1F2937" />
    <path d="M141 180 L157 202 Q195 205 233 202 L249 180 Z" fill="#374151" />
    <rect x="180" y="165" width="22" height="15" fill="#E5E9ED" stroke="#1F2937" stroke-width="2" rx="2" />
    <circle cx="191" cy="172" r="3" fill="#E5484D" />

    <!-- Masts -->
    <rect x="165" y="110" width="4" height="70" fill="#1F2937" />
    <rect x="205" y="98" width="4" height="82" fill="#1F2937" />

    <!-- Sails Furled / Caution Colors -->
    <path d="M169 115 L195 150 L169 155 Z" fill="#F6C945" />
    <path d="M209 105 L235 145 L209 150 Z" fill="#F4743B" />
  </g>

  <!-- Wrench & Gear Indicator (Maintenance / Engine issue) -->
  <g transform="translate(255, 65)">
    <rect width="90" height="40" rx="8" fill="#FFFFFF" stroke="#E5484D" stroke-width="2" />
    <text x="45" y="27" font-family="'Epilogue', 'Outfit', sans-serif" font-weight="700" font-size="20" fill="#E5484D" text-anchor="middle">500</text>
  </g>

  <!-- Floating Alert Shield -->
  <g transform="translate(85, 90)">
    <circle cx="24" cy="24" r="22" fill="#FEECEE" stroke="#E5484D" stroke-width="2" />
    <path d="M24 14 L24 26" stroke="#E5484D" stroke-width="3" stroke-linecap="round" />
    <circle cx="24" cy="32" r="2" fill="#E5484D" />
  </g>
</svg>
