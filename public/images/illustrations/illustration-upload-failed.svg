<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <!-- Background Canvas -->
  <circle cx="200" cy="150" r="120" fill="#F3F6F8" />
  
  <!-- Base Ground -->
  <ellipse cx="200" cy="235" rx="85" ry="12" fill="#E5E9ED" />

  <!-- Cloud Outline in Flat Style -->
  <path d="M150 120 C150 100 170 85 195 85 C220 85 240 100 245 115 C255 115 265 125 265 138 C265 152 252 160 240 160 H150 C135 160 125 148 125 138 C125 126 135 120 150 120 Z" fill="#FFFFFF" stroke="#6B7280" stroke-width="2" />
  
  <!-- Document File Detached & Falling -->
  <g transform="translate(160, 140)">
    <rect width="80" height="95" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" />
    <!-- Dog ear folded corner -->
    <polygon points="60,0 80,20 60,20" fill="#E5E9ED" />
    <polygon points="60,0 80,20 80,0" fill="#F3F6F8" />
    
    <!-- File lines -->
    <rect x="15" y="25" width="50" height="6" rx="2" fill="#0E9AA7" />
    <rect x="15" y="38" width="40" height="5" rx="2" fill="#E5E9ED" />
    <rect x="15" y="50" width="50" height="5" rx="2" fill="#E5E9ED" />
    <rect x="15" y="62" width="30" height="5" rx="2" fill="#E5E9ED" />

    <!-- Red exclamation on document center -->
    <circle cx="40" cy="78" r="8" fill="#FEECEE" stroke="#E5484D" stroke-width="1.5" />
    <text x="40" y="82" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#E5484D" text-anchor="middle">!</text>
  </g>

  <!-- Broken Upload Arrow -->
  <g transform="translate(195, 100)">
    <path d="M5 25 L5 5" stroke="#E5484D" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4" />
    <polyline points="0,12 5,5 10,12" stroke="#E5484D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Status Alert Badge on Top Right -->
  <g transform="translate(260, 65)">
    <rect width="90" height="28" rx="14" fill="#FEECEE" stroke="#E5484D" stroke-width="1.5" />
    <text x="45" y="19" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#E5484D" text-anchor="middle">MAX 2MB</text>
  </g>
</svg>
